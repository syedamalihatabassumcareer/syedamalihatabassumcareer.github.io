<!doctype html>
<!--
  Template for public/og/default.png (the image shown when a link to the site
  is shared on LinkedIn, Slack, etc.). This file is NOT deployed.

  Regenerate after changing the name or headline (Chrome must be installed):
    "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --hide-scrollbars ^
      --virtual-time-budget=5000 --window-size=1200,630 --screenshot="%CD%\public\og\default.png" "%CD%\scripts\social-card.html"
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=block" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        box-sizing: border-box; padding: 0 0 0 88px;
        display: grid; grid-template-columns: 1fr 470px; align-items: center;
        background: radial-gradient(60% 80% at 80% 50%, #e3f4fe, #ffffff 70%); color: #1a1a1a;
        font-family: 'Lato', system-ui, sans-serif;
      }
      .logo { font-weight: 900; font-size: 30px; background: linear-gradient(90deg, #19aaf8, #1abe51); -webkit-background-clip: text; color: transparent; }
      .hi { margin: 46px 0 6px; font-size: 28px; color: #5f6874; }
      h1 { margin: 0; font-size: 52px; font-weight: 700; letter-spacing: -0.01em; }
      .role { margin: 6px 0 22px; font-size: 84px; font-weight: 900; line-height: 1.1; white-space: nowrap; letter-spacing: -0.02em;
        background: linear-gradient(90deg, #0068b4, #4b4fd8 60%, #6a3fd1); -webkit-background-clip: text; color: transparent; }
      p { margin: 0; font-size: 28px; font-weight: 700; color: #454c55; max-width: 22em; }
      .art { position: relative; width: 470px; height: 630px; }
      .disc { position: absolute; left: 30px; top: 85px; width: 460px; height: 460px; border-radius: 50%; background: #ffffff; border: 1px solid #dde6ee; box-shadow: 0 30px 60px -30px rgb(15 40 70 / .35); }
      svg { position: absolute; left: 70px; top: 125px; width: 380px; height: 380px; }
    </style>
  </head>
  <body>
    <div>
      <div class="logo">Maliha.</div>
      <div class="hi">Hi, I am</div>
      <h1>Syeda Maliha Tabassum</h1>
      <div class="role">AI &amp; Technology</div>
      <p>CSE graduate, aspiring business leader — open to Management Trainee programmes</p>
    </div>
    <div class="art" aria-hidden="true">
      <div class="disc"></div>
      <svg viewBox="0 0 380 380">
        <g stroke="#9fd8fb" stroke-width="3" fill="none">
          <path d="M190 190 L90 110 M190 190 L300 100 M190 190 L310 260 M190 190 L100 290 M90 110 L300 100 M310 260 L100 290" />
        </g>
        <g stroke="#1abe51" stroke-width="3" fill="none" stroke-dasharray="6 6">
          <path d="M90 110 L100 290" />
        </g>
        <circle cx="190" cy="190" r="34" fill="#0078cf" />
        <circle cx="190" cy="190" r="56" fill="none" stroke="#19aaf8" opacity=".35" stroke-width="2" />
        <circle cx="90" cy="110" r="18" fill="#19aaf8" />
        <circle cx="300" cy="100" r="18" fill="#19aaf8" />
        <circle cx="310" cy="260" r="18" fill="#1abe51" />
        <circle cx="100" cy="290" r="18" fill="#19aaf8" />
      </svg>
    </div>
  </body>
</html>
