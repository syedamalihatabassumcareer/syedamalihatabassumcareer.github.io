<!doctype html>
<!--
  Template for public/og/default.png (the image shown when a link to the site
  is shared on LinkedIn, Slack, etc.). This file is NOT deployed.

  Regenerate after changing the name or headline (Chrome must be installed):
    "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --hide-scrollbars ^
      --virtual-time-budget=5000 --window-size=1200,630 --screenshot="%CD%\public\og\default.png" "%CD%\scripts\social-card.html"
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=block" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        box-sizing: border-box; padding: 0 0 0 88px;
        display: grid; grid-template-columns: 1fr 470px; align-items: center;
        background: #101010; color: #f5f5f5; font-family: 'Lato', system-ui, sans-serif;
      }
      .logo { font-weight: 900; font-size: 30px; background: linear-gradient(90deg, #fd6f00, #e5322d); -webkit-background-clip: text; color: transparent; }
      .hi { margin: 46px 0 6px; font-size: 28px; color: #8f8f8f; }
      h1 { margin: 0; font-size: 52px; font-weight: 700; letter-spacing: -0.01em; }
      .role { margin: 6px 0 22px; font-size: 104px; font-weight: 900; line-height: 1; letter-spacing: -0.02em;
        background: linear-gradient(90deg, #b84a00, #fd6f00 55%, #ff8a2a); -webkit-background-clip: text; color: transparent; }
      p { margin: 0; font-size: 28px; font-weight: 700; color: #b3b3b3; max-width: 22em; }
      .art { position: relative; width: 470px; height: 630px; }
      .disc { position: absolute; left: 30px; top: 85px; width: 460px; height: 460px; border-radius: 50%; background: #1d1d1d; border: 1px solid #303030; }
      svg { position: absolute; left: 70px; top: 125px; width: 380px; height: 380px; }
    </style>
  </head>
  <body>
    <div>
      <div class="logo">Maliha.</div>
      <div class="hi">Hi, I am</div>
      <h1>Syeda Maliha Tabassum</h1>
      <div class="role">AI Researcher</div>
      <p>Multimodal AI, agentic systems and reliable decision-making</p>
    </div>
    <div class="art" aria-hidden="true">
      <div class="disc"></div>
      <svg viewBox="0 0 380 380">
        <g fill="none" stroke="#fd6f00">
          <circle cx="70" cy="300" r="26" opacity=".5" /><circle cx="70" cy="300" r="52" opacity=".28" />
          <path d="M70 300 L190 170 L190 270 Z" fill="rgb(253 111 0 / .16)" stroke="none" />
          <path d="M70 300 L190 170 M70 300 L190 270" stroke-dasharray="3 5" />
        </g>
        <g fill="none" stroke="#8f8f8f" stroke-width="1.6">
          <path d="M228 140 H300 V212 H228 Z" stroke-dasharray="4 4" opacity=".6" />
          <path d="M190 170 L228 140 M262 170 L300 140 M262 270 L300 212 M190 270 L228 212" opacity=".7" />
          <path d="M190 170 H262 V270 H190 Z" fill="#232323" />
        </g>
        <path d="M70 300 C 140 240, 200 200, 236 120 S 270 70, 300 64" fill="none" stroke="#fd6f00" stroke-width="3" stroke-linecap="round" />
        <circle cx="300" cy="64" r="20" fill="none" stroke="#fd6f00" opacity=".45" />
        <circle cx="300" cy="64" r="9" fill="#fd6f00" />
        <circle cx="70" cy="300" r="8" fill="#fd6f00" stroke="#1d1d1d" stroke-width="4" />
      </svg>
    </div>
  </body>
</html>
